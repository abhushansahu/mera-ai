name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Black check
        run: black --check app tests
      - name: Mypy
        run: mypy app

  backend-tests:
    runs-on: ubuntu-latest
    needs: backend-fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -m "not integration and not performance" tests
      - name: Performance smoke checks
        run: pytest -m performance tests/performance

  edge-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build edge
        run: go build ./...
