services:
  # PostgreSQL Database - Main application database
  postgres:
    image: postgres:16-alpine
    container_name: mera-ai-postgres
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mera AI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mera-ai-app
    env_file:
      - .env
    environment:
      # Override database URL to use service name
      DATABASE_URL: postgresql+psycopg2://ai_user:ai_password@postgres:5432/ai_assistant
      # Override ChromaDB persist directory to use volume
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    volumes:
      - chroma_data:/app/data/chroma_db
      # Mount Obsidian vault if configured (optional)
      # Uncomment and set your vault path:
      # - /path/to/your/obsidian/vault:/app/obsidian_vault:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  edge:
    build:
      context: ./edge-go
      dockerfile: Dockerfile
    container_name: mera-ai-edge
    ports:
      - "8081:8081"
    environment:
      EDGE_ADDR: ":8081"
      EDGE_UPSTREAM_PRIMARY: http://app:8000
      EDGE_SHADOW_ENABLED: "false"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mera-ai-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    depends_on:
      edge:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  chroma_data: